name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # The custom domain lives in the CNAME file at the repository root.
      # Edit that file to change the domain; delete it to go back to the github.io address.
      - name: Set custom domain from the CNAME file
        if: ${{ hashFiles('CNAME') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          domain="$(tr -d ' \r\n' < CNAME)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' || true)"
          if [ "$current" = "$domain" ]; then
            echo "Custom domain already $domain"
          elif gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f cname="$domain" >/dev/null; then
            echo "Custom domain set to $domain"
          else
            echo "::warning::Could not set the custom domain automatically. Enter $domain under Settings > Pages > Custom domain."
          fi
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -F https_enforced=true >/dev/null 2>&1; then
            echo "HTTPS enforced"
          else
            echo "HTTPS not enforceable yet (the certificate is issued after the DNS check passes)"
          fi
